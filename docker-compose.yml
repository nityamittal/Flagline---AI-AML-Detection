services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flagline
      POSTGRES_PASSWORD: flagline
      POSTGRES_DB: flagline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagline -d flagline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
